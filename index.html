<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나만의 표정 만들기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Nanum Gothic', sans-serif;
            background-image: radial-gradient(#fde68a 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .custom-scrollbar::-webkit-scrollbar { height: 10px; width: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #fbbf24; border-radius: 10px; }
        button:active { transform: scale(0.95); }
        .grid-item-svg { width: 100%; height: 100%; }
    </style>
</head>
<body class="min-h-screen bg-pink-50 p-4 md:p-8">
    <div class="max-w-5xl mx-auto bg-white rounded-[3rem] shadow-2xl overflow-hidden border-[12px] border-yellow-300">
        
        <!-- 헤더 섹션 -->
        <header class="bg-yellow-400 p-8 text-center relative">
            <h1 class="text-4xl md:text-5xl font-extrabold text-white drop-shadow-lg mb-4">
               내 마음대로 얼굴 만들기 
            </h1>
            <div class="bg-white/90 inline-flex items-center gap-4 px-8 py-3 rounded-2xl text-xl font-bold text-yellow-800 shadow-inner">
                <span id="mission-text">어떤 기분인지 표정으로 만들어볼까요? 😊</span>
                <button onclick="nextMission()" class="p-2 bg-yellow-500 text-white rounded-full hover:bg-yellow-600 transition-transform active:scale-90 shadow-md">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
                </button>
            </div>
        </header>

        <div class="flex flex-col lg:flex-row p-8 gap-10">
            
            <!-- 왼쪽: 얼굴 캔버스 (얼굴 크기 0.8배 조정) -->
            <div class="flex-[1.2] flex flex-col items-center justify-center bg-blue-50 rounded-[2.5rem] p-10 border-4 border-dashed border-blue-200 relative">
                <div id="face-container" class="relative w-full max-w-[380px]">
                    <!-- JS에서 SVG 렌더링 -->
                </div>

                <div class="mt-12 flex gap-6">
                    <button onclick="resetFace()" class="flex items-center gap-3 px-8 py-4 bg-gray-100 text-gray-700 rounded-2xl font-bold hover:bg-gray-200 transition-all text-xl shadow-sm">
                        처음부터
                    </button>
                    <button onclick="window.print()" class="flex items-center gap-3 px-10 py-4 bg-green-500 text-white rounded-2xl font-bold hover:bg-green-600 transition-all shadow-xl text-xl transform hover:-translate-y-1">
                        사진찍기
                    </button>
                </div>
            </div>

            <!-- 오른쪽: 조작창 (그리드 크기 확대) -->
            <div class="flex-1 flex flex-col">
                <!-- 탭 메뉴 -->
                <div class="flex gap-3 mb-6 overflow-x-auto pb-2 custom-scrollbar">
                    <button onclick="setActiveTab('brows')" id="tab-brows" class="flex-1 flex items-center justify-center py-5 px-6 rounded-2xl font-black transition-all whitespace-nowrap text-xl">눈썹</button>
                    <button onclick="setActiveTab('eyes')" id="tab-eyes" class="flex-1 flex items-center justify-center py-5 px-6 rounded-2xl font-black transition-all whitespace-nowrap text-xl">눈</button>
                    <button onclick="setActiveTab('mouth')" id="tab-mouth" class="flex-1 flex items-center justify-center py-5 px-6 rounded-2xl font-black transition-all whitespace-nowrap text-xl">입</button>
                    <button onclick="setActiveTab('nose')" id="tab-nose" class="flex-1 flex items-center justify-center py-5 px-6 rounded-2xl font-black transition-all whitespace-nowrap text-xl">코/장식</button>
                </div>

                <!-- 아이템 그리드 (버튼을 더 큼직하게 2열로 구성) -->
                <div id="items-grid" class="grid grid-cols-2 gap-6 bg-orange-50 p-8 rounded-[2rem] border-4 border-orange-100 overflow-y-auto max-h-[650px] shadow-inner flex-grow">
                    <!-- JS에서 아이템 렌더링 -->
                </div>
            </div>
        </div>
    </div>

    <footer class="mt-12 text-center text-yellow-900/40 font-bold tracking-widest uppercase">
        Emotional Expression Game for Kids • 2024
    </footer>

    <script>
        let selectedParts = { brows: 0, eyes: 0, mouth: 0, nose: 0 };
        let activeTab = 'brows';

        const missions = [
            "어떤 기분인지 표정으로 만들어볼까요? 😊",
            "오늘 나의 기분은 어떤가요? 조각들을 골라봐요!",
            "친구의 표정을 관찰하고 비슷하게 만들어볼까요?",
            "지금 가장 하고 싶은 표정을 지어보세요!",
            "아주 재미있는 표정을 상상해서 만들어봐요!"
        ];

        const partsData = {
            brows: [
                { id: 0, draw: (c) => `<path d="M35,45 Q50,40 65,45 M135,45 Q150,40 165,45" stroke="${c}" stroke-width="6" fill="none" stroke-linecap="round" />` },
                { id: 1, draw: (c) => `<path d="M35,50 L65,35 M135,35 L165,50" stroke="${c}" stroke-width="8" fill="none" stroke-linecap="round" />` },
                { id: 2, draw: (c) => `<path d="M35,35 Q50,45 65,55 M135,55 Q150,45 165,35" stroke="${c}" stroke-width="6" fill="none" stroke-linecap="round" />` },
                { id: 3, draw: (c) => `<path d="M40,30 Q50,20 60,30 M140,30 Q150,20 160,30" stroke="${c}" stroke-width="6" fill="none" stroke-linecap="round" />` },
                { id: 4, draw: (c) => `<path d="M35,45 L65,42 M130,40 Q150,25 170,45" stroke="${c}" stroke-width="6" fill="none" stroke-linecap="round" />` },
                { id: 5, draw: (c) => `<path d="M40,50 Q50,30 65,45 M135,45 Q150,30 160,50" stroke="${c}" stroke-width="6" fill="none" stroke-linecap="round" />` },
                { id: 6, draw: (c) => `<path d="M40,50 L65,40 M135,40 L160,50" stroke="${c}" stroke-width="8" stroke-linecap="round"/><path d="M92,45 L92,55 M108,45 L108,55" stroke="${c}" stroke-width="3" stroke-linecap="round"/>` },
                { id: 7, draw: (c) => `<path d="M35,35 L65,50 M135,50 L165,35" stroke="${c}" stroke-width="6" stroke-linecap="round" />` },
                { id: 8, draw: (c) => `<path d="M30,45 H70 M130,45 H170" stroke="${c}" stroke-width="8" stroke-linecap="round" />` },
                { id: 9, draw: (c) => `<path d="M40,40 Q55,55 70,35 M130,35 Q145,55 160,40" stroke="${c}" stroke-width="6" fill="none" stroke-linecap="round" />` },
                { id: 10, draw: (c) => `<path d="M35,55 Q50,40 70,55 M130,55 Q150,40 165,55" stroke="${c}" stroke-width="6" fill="none" stroke-linecap="round" />` },
                { id: 11, draw: (c) => `<path d="M45,40 Q55,30 65,40 M135,40 Q145,30 155,40" stroke="${c}" stroke-width="10" fill="none" stroke-linecap="round" opacity="0.8" />` }
            ],
            eyes: [
                { id: 0, draw: (c) => `<circle cx="60" cy="85" r="12" fill="${c}" /><circle cx="140" cy="85" r="12" fill="${c}" />` },
                { id: 1, draw: (c) => `<path d="M40,90 Q60,70 80,90 M120,90 Q140,70 160,90" stroke="${c}" stroke-width="10" fill="none" stroke-linecap="round" />` },
                { id: 2, draw: (c) => `<path d="M40,85 L70,75" stroke="${c}" stroke-width="12" stroke-linecap="round" /><path d="M130,75 L160,85" stroke="${c}" stroke-width="12" stroke-linecap="round" />` },
                { id: 3, draw: (c) => `<rect x="35" y="75" width="45" height="25" rx="5" fill="#333" /><rect x="120" y="75" width="45" height="25" rx="5" fill="#333" /><path d="M80,87 H120" stroke="#333" stroke-width="4" />` },
                { id: 4, draw: (c) => `<path d="M60,95 C60,95 40,82 40,70 C40,58 55,55 60,68 C65,55 80,58 80,70 C80,82 60,95 60,95 Z" fill="#ff7676" stroke="#2D1B15" stroke-width="4" stroke-linejoin="round" /><path d="M140,95 C140,95 120,82 120,70 C120,58 135,55 140,68 C145,55 160,58 160,70 C160,82 140,95 140,95 Z" fill="#ff7676" stroke="#2D1B15" stroke-width="4" stroke-linejoin="round" />` },
                { id: 5, draw: (c) => `<path d="M40,80 L65,95 L40,110" stroke="${c}" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M160,80 L135,95 L160,110" stroke="${c}" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>` },
                { id: 6, draw: (c) => `<circle cx="60" cy="85" r="12" fill="${c}" /><circle cx="140" cy="85" r="12" fill="${c}" /><path d="M60,105 V160 M140,105 V160" stroke="#93c5fd" stroke-width="12" stroke-linecap="round" opacity="0.6"/>` },
                { id: 7, draw: (c) => `<path d="M40,85 L80,85" stroke="${c}" stroke-width="6" stroke-linecap="round" /><circle cx="60" cy="95" r="8" fill="${c}" /><path d="M120,85 L160,85" stroke="${c}" stroke-width="6" stroke-linecap="round" /><circle cx="140" cy="95" r="8" fill="${c}" />` },
                { id: 8, draw: (c) => `<circle cx="60" cy="85" r="18" fill="none" stroke="${c}" stroke-width="2" /><circle cx="60" cy="85" r="6" fill="${c}" /><circle cx="140" cy="85" r="18" fill="none" stroke="${c}" stroke-width="2" /><circle cx="140" cy="85" r="6" fill="${c}" />` },
                { id: 9, draw: (c) => `<path d="M45,80 Q60,100 75,80 M125,80 Q140,100 155,80" stroke="${c}" stroke-width="8" fill="none" stroke-linecap="round" />` },
                { id: 10, draw: (c) => `<circle cx="60" cy="85" r="15" fill="${c}" /><circle cx="56" cy="81" r="5" fill="white" /><circle cx="140" cy="85" r="15" fill="${c}" /><circle cx="136" cy="81" r="5" fill="white" />` },
                { id: 11, draw: (c) => `<circle cx="60" cy="85" r="22" fill="white" stroke="${c}" stroke-width="2" /><circle cx="72" cy="85" r="8" fill="${c}" /><circle cx="140" cy="85" r="22" fill="white" stroke="${c}" stroke-width="2" /><circle cx="128" cy="85" r="8" fill="${c}" />` }
            ],
            mouth: [
                { id: 0, draw: (c) => `<path d="M60,145 Q100,185 140,145" stroke="${c}" stroke-width="8" fill="none" stroke-linecap="round" />` },
                { id: 1, draw: (c) => `<path d="M70,170 Q100,150 130,170" stroke="${c}" stroke-width="8" fill="none" stroke-linecap="round" />` },
                { id: 2, draw: (c) => `<circle cx="100" cy="165" r="18" fill="white" stroke="${c}" stroke-width="4" />` },
                { id: 3, draw: (c) => `<path d="M75,160 H125" stroke="${c}" stroke-width="8" stroke-linecap="round" />` },
                { id: 4, draw: (c) => `<path d="M70,165 Q100,185 130,155" stroke="${c}" stroke-width="6" fill="none" stroke-linecap="round" />` },
                { id: 5, draw: (c) => `<path d="M70,150 Q100,190 130,150 Z" fill="white" stroke="${c}" stroke-width="4" /><path d="M75,160 H125" stroke="#e2e8f0" stroke-width="1" />` },
                { id: 6, draw: (c) => `<path d="M65,150 Q100,210 135,150 Z" fill="#991b1b" stroke="${c}" stroke-width="4" />` },
                { id: 7, draw: (c) => `<path d="M90,165 Q100,155 110,165 Q100,175 90,165" fill="#f43f5e" stroke="${c}" stroke-width="2" />` },
                { id: 8, draw: (c) => `<path d="M80,165 Q95,175 110,165 Q125,155 135,165" stroke="${c}" stroke-width="6" fill="none" stroke-linecap="round" />` },
                { id: 9, draw: (c) => `<path d="M85,165 Q92,175 100,165 Q108,175 115,165" stroke="${c}" stroke-width="6" fill="none" stroke-linecap="round" />` },
                { id: 10, draw: (c) => `<path d="M80,155 H120" stroke="${c}" stroke-width="6" /><path d="M100,155 V175" stroke="${c}" stroke-width="4" /><path d="M90,155 V170 M110,155 V170" stroke="${c}" stroke-width="2" />` },
                { id: 11, draw: (c) => `<path d="M75,155 H125" stroke="${c}" stroke-width="6" /><path d="M90,155 V180 Q100,195 110,180 V155" fill="#f43f5e" />` }
            ],
            nose: [
                { id: 0, draw: (c) => `<circle cx="100" cy="115" r="5" fill="#5D4037" />` },
                { id: 1, draw: (c) => `<path d="M95,120 Q100,115 105,120" stroke="#5D4037" stroke-width="4" fill="none" stroke-linecap="round" />` },
                { id: 2, draw: (c) => `<circle cx="50" cy="120" r="15" fill="#fca5a5" opacity="0.4" /><circle cx="150" cy="120" r="15" fill="#fca5a5" opacity="0.4" />` },
                { id: 3, draw: (c) => `<path d="M100,105 Q110,115 100,125" stroke="#5D4037" stroke-width="6" fill="none" stroke-linecap="round" />` },
                { id: 4, draw: (c) => `<g transform="translate(0, -5)"><path d="M45,20 L30,-20 L65,15 Z" fill="#FFDBAC" stroke="#D97706" stroke-width="3" /><path d="M155,20 L170,-20 L135,15 Z" fill="#FFDBAC" stroke="#D97706" stroke-width="3" /></g>` },
                { id: 5, draw: (c) => `<g transform="translate(135, -5) rotate(-10)"><path d="M0,15 L15,15 L0,30 L15,30" stroke="#3b82f6" stroke-width="8" fill="none" stroke-linecap="round" /><path d="M25,0 L35,0 L25,10 L35,10" stroke="#60a5fa" stroke-width="6" fill="none" stroke-linecap="round" /></g>` },
                { id: 6, draw: (c) => `<g transform="translate(0, -25)"><path d="M70,30 L100,-70 L130,30 Z" fill="#a855f7" stroke="#7e22ce" stroke-width="2" /><path d="M82,0 L118,0 M88,-25 L112,-25 M94,-50 L106,-50" stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.6"/><circle cx="-15" cy="40" r="5" fill="#ef4444" /><rect x="220" y="30" width="7" height="7" fill="#3b82f6" /><circle cx="-20" cy="160" r="6" fill="#22c55e" /><rect x="215" y="170" width="8" height="8" fill="#eab308" transform="rotate(45)" /><circle cx="20" cy="-45" r="5" fill="#f472b6" /><rect x="185" y="-50" width="7" height="7" fill="#818cf8" /></g>` },
                { id: 7, draw: (c) => `<g transform="translate(145, -15)"><path d="M5,5 Q-5,10 5,15" fill="none" stroke="#ef4444" stroke-width="6" stroke-linecap="round" /><path d="M15,5 Q25,10 15,15" fill="none" stroke="#ef4444" stroke-width="6" stroke-linecap="round" /><path d="M10,0 Q5,-10 10,-20" fill="none" stroke="#ef4444" stroke-width="6" stroke-linecap="round" transform="rotate(90, 10, 0) translate(-10, 10)"/><path d="M10,0 Q5,-10 10,-20" fill="none" stroke="#ef4444" stroke-width="6" stroke-linecap="round" transform="rotate(90, 10, 0) translate(-10, -10)"/></g>` },
                { id: 8, draw: (c) => `<g transform="translate(140, 10)"><path d="M0,0 Q-10,15 0,25 Q10,15 0,0 Z" fill="#60a5fa" stroke="white" stroke-width="1" transform="rotate(-15)"/><path d="M15,10 Q5,25 15,35 Q25,25 15,10 Z" fill="#93c5fd" stroke="white" stroke-width="1" transform="rotate(5)"/><path d="M-15,15 Q-25,30 -15,40 Q-5,30 -15,15 Z" fill="#bfdbfe" stroke="white" stroke-width="1" transform="rotate(-30)"/></g>` },
                { id: 9, draw: (c) => `<rect x="85" y="115" width="30" height="10" rx="2" fill="#fed7aa" stroke="#fb923c" stroke-width="1" /><path d="M95,115 V125 M105,115 V125" stroke="#fb923c" stroke-width="1" />` },
                { id: 10, draw: (c) => `<path d="M100,105 L100,125 L95,120" stroke="#5D4037" stroke-width="4" fill="none" stroke-linecap="round" />` },
                { id: 11, draw: (c) => `` } 
            ]
        };

        function renderFace() {
            const container = document.getElementById('face-container');
            // viewBox 조정을 통해 얼굴 크기 0.8배로 축소 (줌 아웃 효과)
            // 중심은 (100, 100), 전체 캔버스 영역을 넓혀 얼굴을 작게 표현
            container.innerHTML = `
                <svg viewBox="-15 -60 230 230" class="w-full h-auto drop-shadow-[0_20px_35px_rgba(0,0,0,0.15)] overflow-visible">
                    <circle cx="100" cy="100" r="92" fill="#FFDBAC" stroke="#D97706" stroke-width="3" />
                    <g class="transition-all duration-300">
                        ${partsData.brows[selectedParts.brows].draw("#5D4037")}
                        ${partsData.eyes[selectedParts.eyes].draw("#2D1B15")}
                        ${partsData.mouth[selectedParts.mouth].draw("#2D1B15")}
                        ${partsData.nose[selectedParts.nose].draw("#8D6E63")}
                    </g>
                </svg>
            `;
        }

        function renderGrid() {
            const grid = document.getElementById('items-grid');
            grid.innerHTML = '';
            
            partsData[activeTab].forEach((item, index) => {
                const btn = document.createElement('button');
                // 버튼 크기 확대 및 큼직한 레이아웃
                btn.className = `aspect-square flex items-center justify-center bg-white rounded-3xl border-[6px] transition-all hover:shadow-2xl ${selectedParts[activeTab] === index ? 'border-yellow-500 bg-yellow-50 scale-105' : 'border-transparent hover:border-yellow-200'}`;
                btn.onclick = () => {
                    selectedParts[activeTab] = index;
                    renderFace();
                    renderGrid();
                };
                
                btn.innerHTML = `
                    <svg viewBox="-20 -20 240 240" class="grid-item-svg p-4">
                        <circle cx="100" cy="100" r="95" fill="#FFF9C4" opacity="0.4" />
                        ${item.draw ? item.draw("#5D4037") : ''}
                    </svg>
                `;
                grid.appendChild(btn);
            });
        }

        function setActiveTab(tab) {
            activeTab = tab;
            ['brows', 'eyes', 'mouth', 'nose'].forEach(t => {
                const el = document.getElementById('tab-' + t);
                if (t === tab) {
                    el.className = 'flex-1 flex items-center justify-center py-5 px-6 rounded-2xl font-black transition-all whitespace-nowrap text-xl bg-yellow-400 text-white shadow-lg scale-105 border-b-8 border-yellow-600';
                } else {
                    el.className = 'flex-1 flex items-center justify-center py-5 px-6 rounded-2xl font-black transition-all whitespace-nowrap text-xl bg-yellow-100 text-yellow-800 hover:bg-yellow-200 border-b-8 border-transparent';
                }
            });
            renderGrid();
        }

        function nextMission() {
            const randomIndex = Math.floor(Math.random() * missions.length);
            document.getElementById('mission-text').innerText = missions[randomIndex];
        }

        function resetFace() {
            selectedParts = { brows: 0, eyes: 0, nose: 0, mouth: 0 };
            renderFace();
            renderGrid();
        }

        setActiveTab('brows');
        renderFace();
    </script>
</body>
</html>
