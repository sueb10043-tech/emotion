<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나만의 표정 만들기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Nanum Gothic', sans-serif;
            background-image: radial-gradient(#fde68a 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #fbbf24; border-radius: 10px; }
        button:active { transform: scale(0.95); }
        
        /* 요소 카드 크기 고정: 얼굴 지름 160px(r=80px)을 수용하도록 설정 */
        .item-card {
            width: 160px;
            height: 181px; /* viewBox 비율 190:215에 맞춘 높이 */
            flex-shrink: 0;
        }
    </style>
</head>
<body class="min-h-screen bg-pink-50 p-2 md:p-4 flex items-center justify-center">
    <div class="max-w-5xl w-full bg-white rounded-[2.5rem] shadow-2xl overflow-hidden border-[10px] border-yellow-300">
        
        <header class="bg-yellow-400 p-4 text-center">
            <h1 class="text-[43px] font-black text-white drop-shadow-md">감정을 표정으로 표현해요</h1>
        </header>

        <div class="flex flex-col lg:flex-row p-4 gap-6 items-start">
            <!-- 왼쪽: 얼굴 캔버스 -->
            <div class="flex-none flex flex-col items-center">
                <div id="capture-target" class="w-[330px] h-[450px] flex flex-col items-center justify-center bg-blue-50 rounded-[2rem] p-4 border-4 border-dashed border-blue-200 relative overflow-hidden">
                    <div id="face-container" class="relative w-full h-full flex items-center justify-center">
                        <!-- SVG 렌더링 -->
                    </div>
                </div>

                <div class="mt-[10px] flex gap-3 w-full">
                    <button onclick="resetFace()" class="flex-1 py-3 bg-gray-100 text-gray-700 rounded-xl font-bold hover:bg-gray-200 transition-all text-lg">처음부터</button>
                    <button onclick="saveFaceImage()" class="flex-1 py-3 bg-green-500 text-white rounded-xl font-bold hover:bg-green-600 transition-all shadow-lg text-lg">사진찍기</button>
                </div>
            </div>

            <!-- 오른쪽: 조작창 -->
            <div class="flex-1 flex flex-col self-stretch overflow-hidden">
                <div class="flex gap-1 mb-2">
                    <button onclick="setActiveTab('brows')" id="tab-brows" class="flex-1 py-2.5 rounded-xl font-black transition-all text-lg">눈썹</button>
                    <button onclick="setActiveTab('eyes')" id="tab-eyes" class="flex-1 py-2.5 rounded-xl font-black transition-all text-lg">눈</button>
                    <button onclick="setActiveTab('mouth')" id="tab-mouth" class="flex-1 py-2.5 rounded-xl font-black transition-all text-lg">입</button>
                    <button onclick="setActiveTab('nose')" id="tab-nose" class="flex-1 py-2.5 rounded-xl font-black transition-all text-lg">코/장식</button>
                </div>

                <!-- 그리드 여백 최적화 -->
                <div id="items-grid" class="grid grid-cols-3 gap-2 bg-orange-50 p-2 rounded-[1.5rem] border-4 border-orange-100 overflow-y-auto max-h-[520px] shadow-inner custom-scrollbar justify-items-center">
                    <!-- 아이템 리스트 -->
                </div>
            </div>
        </div>
    </div>

    <script>
        let selectedParts = { brows: -1, eyes: -1, mouth: -1, nose: -1 };
        let activeTab = 'brows';

        const partsData = {
            brows: [
                { id: 0, draw: (c, s=1) => `<path d="M40,25 Q55,20 70,25 M130,25 Q145,20 160,25" stroke="${c}" stroke-width="${6*s}" fill="none" stroke-linecap="round" />` },
                { id: 1, draw: (c, s=1) => `<path d="M40,30 L70,15 M130,15 L160,30" stroke="${c}" stroke-width="${8*s}" fill="none" stroke-linecap="round" />` },
                { id: 2, draw: (c, s=1) => `<path d="M40,15 Q55,25 70,35 M130,35 Q145,25 160,15" stroke="${c}" stroke-width="${6*s}" fill="none" stroke-linecap="round" />` },
                { id: 3, draw: (c, s=1) => `<path d="M45,10 Q55,0 65,10 M135,10 Q145,0 155,10" stroke="${c}" stroke-width="${6*s}" fill="none" stroke-linecap="round" />` },
                { id: 4, draw: (c, s=1) => `<path d="M40,25 L75,22 M125,22 L160,25" stroke="${c}" stroke-width="${7*s}" fill="none" stroke-linecap="round" />` },
                { id: 5, draw: (c, s=1) => `<path d="M45,30 Q60,10 75,25 M125,25 Q140,10 155,30" stroke="${c}" stroke-width="${6*s}" fill="none" stroke-linecap="round" />` },
                { id: 6, draw: (c, s=1) => `<path d="M40,30 L70,20 M130,20 L160,30" stroke="${c}" stroke-width="${8*s}" stroke-linecap="round"/><path d="M93,25 V35 M107,25 V35" stroke="${c}" stroke-width="${3*s}" stroke-linecap="round"/>` },
                { id: 7, draw: (c, s=1) => `<path d="M40,15 L70,35 M130,35 L160,15" stroke="${c}" stroke-width="${8*s}" stroke-linecap="round" />` },
                { id: 8, draw: (c, s=1) => `<path d="M35,25 H75 M125,25 H165" stroke="${c}" stroke-width="${10*s}" stroke-linecap="round" />` },
                { id: 9, draw: (c, s=1) => `<path d="M40,20 Q55,40 70,20 M130,20 Q145,40 160,20" stroke="${c}" stroke-width="${6*s}" fill="none" stroke-linecap="round" />` },
                { id: 10, draw: (c, s=1) => `<path d="M40,35 Q55,20 70,35 M130,35 Q145,20 160,35" stroke="${c}" stroke-width="${6*s}" fill="none" stroke-linecap="round" />` },
                { id: 11, draw: (c, s=1) => `<path d="M45,20 Q60,5 75,20 M125,20 Q145,5 155,20" stroke="${c}" stroke-width="${12*s}" fill="none" stroke-linecap="round" opacity="0.8" />` }
            ],
            eyes: [
                { id: 0, draw: (c, s=1) => `<circle cx="65" cy="65" r="${14*s}" fill="${c}" /><circle cx="135" cy="65" r="${14*s}" fill="${c}" />` },
                { id: 1, draw: (c, s=1) => `<path d="M45,70 Q65,45 85,70 M115,70 Q135,45 155,70" stroke="${c}" stroke-width="${10*s}" fill="none" stroke-linecap="round" />` },
                { id: 2, draw: (c, s=1) => `<path d="M40,70 L75,60 M125,60 L160,70" stroke="${c}" stroke-width="${14*s}" stroke-linecap="round" />` },
                { id: 3, draw: (c, s=1) => `<rect x="${40-5*s}" y="55" width="${45*s}" height="${25*s}" rx="${5*s}" fill="#333" /><rect x="${120-5*s}" y="55" width="${45*s}" height="${25*s}" rx="${5*s}" fill="#333" /><path d="M85,69 H115" stroke="#333" stroke-width="${4*s}" />` },
                { id: 4, draw: (c, s=1) => `<g transform="scale(${s}) translate(${(1-s)*100}, ${(1-s)*80})"><path d="M65,75 C65,75 40,62 40,50 C40,38 55,35 60,48 C65,35 80,38 80,50 C80,62 60,75 60,75 Z" fill="#ff7676" stroke="#2D1B15" stroke-width="4" stroke-linejoin="round" /><path d="M135,75 C135,75 110,62 110,50 C110,38 125,35 130,48 C135,35 150,38 150,50 C150,62 130,75 130,75 Z" fill="#ff7676" stroke="#2D1B15" stroke-width="4" stroke-linejoin="round" /></g>` },
                { id: 5, draw: (c, s=1) => `<path d="M45,60 L75,75 L45,90" stroke="${c}" stroke-width="${10*s}" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M155,60 L125,75 L155,90" stroke="${c}" stroke-width="${10*s}" fill="none" stroke-linecap="round" stroke-linejoin="round"/>` },
                { id: 6, draw: (c, s=1) => `<circle cx="65" cy="65" r="${14*s}" fill="${c}" /><circle cx="135" cy="65" r="${14*s}" fill="${c}" /><path d="M65,85 V140 M135,85 V140" stroke="#93c5fd" stroke-width="${12*s}" stroke-linecap="round" opacity="0.6"/>` },
                { id: 7, draw: (c, s=1) => `<path d="M45,65 L85,65" stroke="${c}" stroke-width="${8*s}" stroke-linecap="round" /><circle cx="65" cy="78" r="${10*s}" fill="${c}" /><path d="M115,65 L155,65" stroke="${c}" stroke-width="${8*s}" stroke-linecap="round" /><circle cx="135" cy="78" r="${10*s}" fill="${c}" />` },
                { id: 8, draw: (c, s=1) => `<circle cx="65" cy="65" r="${20*s}" fill="none" stroke="${c}" stroke-width="${3*s}" /><circle cx="65" cy="65" r="${8*s}" fill="${c}" /><circle cx="135" cy="65" r="${20*s} fill="none" stroke="${c}" stroke-width="${3*s}" /><circle cx="135" cy="65" r="${8*s}" fill="${c}" />` },
                { id: 9, draw: (c, s=1) => `<path d="M50,65 Q65,85 80,65 M120,65 Q135,85 150,65" stroke="${c}" stroke-width="${10*s}" fill="none" stroke-linecap="round" />` },
                { id: 10, draw: (c, s=1) => `<circle cx="65" cy="65" r="${16*s}" fill="${c}" /><circle cx="60" cy="60" r="${6*s}" fill="white" /><circle cx="135" cy="65" r="${16*s}" fill="${c}" /><circle cx="130" cy="60" r="${6*s}" fill="white" />` },
                { id: 11, draw: (c, s=1) => `<circle cx="65" cy="65" r="${24*s}" fill="white" stroke="${c}" stroke-width="${2*s}" /><circle cx="78" cy="65" r="${10*s}" fill="${c}" /><circle cx="135" cy="65" r="${24*s} fill="white" stroke="${c}" stroke-width="${2*s}" /><circle cx="122" cy="65" r="${10*s}" fill="${c}" />` }
            ],
            mouth: [
                { id: 0, draw: (c, s=1) => `<path d="M60,125 Q100,165 140,125" stroke="${c}" stroke-width="${10*s}" fill="none" stroke-linecap="round" />` },
                { id: 1, draw: (c, s=1) => `<path d="M70,150 Q100,130 130,150" stroke="${c}" stroke-width="${10*s}" fill="none" stroke-linecap="round" />` },
                { id: 2, draw: (c, s=1) => `<circle cx="100" cy="145" r="${18*s}" fill="white" stroke="${c}" stroke-width="${5*s}" />` },
                { id: 3, draw: (c, s=1) => `<path d="M75,140 H125" stroke="${c}" stroke-width="${10*s}" stroke-linecap="round" />` },
                { id: 4, draw: (c, s=1) => `<path d="M70,145 Q100,165 130,135" stroke="${c}" stroke-width="${8*s}" fill="none" stroke-linecap="round" />` },
                { id: 5, draw: (c, s=1) => `<path d="M70,130 Q100,170 130,130 Z" fill="white" stroke="${c}" stroke-width="${5*s}" /><path d="M75,140 H125" stroke="#e2e8f0" stroke-width="${2*s}" />` },
                { id: 6, draw: (c, s=1) => `<path d="M65,130 Q100,190 135,130 Z" fill="#991b1b" stroke="${c}" stroke-width="${5*s}" />` },
                { id: 7, draw: (c, s=1) => `<path d="M90,145 Q100,135 110,145 Q100,155 90,145" fill="#f43f5e" stroke="${c}" stroke-width="${3*s}" />` },
                { id: 8, draw: (c, s=1) => `<path d="M85,145 Q92,155 100,145 Q108,155 115,145" stroke="${c}" stroke-width="${8*s}" fill="none" stroke-linecap="round" />` },
                { id: 9, draw: (c, s=1) => `<path d="M80,145 Q100,160 120,145" stroke="${c}" stroke-width="${8*s}" fill="none" stroke-linecap="round" />` },
                { id: 10, draw: (c, s=1) => `<path d="M80,135 H120" stroke="${c}" stroke-width="${6*s}" /><path d="M100,135 V155" stroke="${c}" stroke-width="${4*s}" /><path d="M90,135 V150 M110,135 V150" stroke="${c}" stroke-width="${2*s}" />` },
                { id: 11, draw: (c, s=1) => `<path d="M75,135 H125" stroke="${c}" stroke-width="${6*s}" /><path d="M90,135 V160 Q100,175 110,160 V135" fill="#f43f5e" />` }
            ],
            nose: [
                { id: 0, draw: (c, s=1) => `<circle cx="100" cy="95" r="${5*s}" fill="#5D4037" />` },
                { id: 1, draw: (c, s=1) => `<path d="M95,100 Q100,95 105,100" stroke="#5D4037" stroke-width="${4*s}" fill="none" stroke-linecap="round" />` },
                { id: 2, draw: (c, s=1) => `<circle cx="50" cy="100" r="${15*s}" fill="#fca5a5" opacity="0.4" /><circle cx="150" cy="100" r="${15*s}" fill="#fca5a5" opacity="0.4" />` },
                { id: 3, draw: (c, s=1) => `<path d="M100,85 Q110,95 100,105" stroke="#5D4037" stroke-width="${6*s}" fill="none" stroke-linecap="round" />` },
                { id: 4, draw: (c, s=1) => `<g transform="translate(130, 20) scale(${s})"><path d="M0,-10 L2, -2 L10,0 L2,2 L0,10 L-2,2 L-10,0 L-2,-2 Z" fill="#FBBF24" /><path d="M-25,20 L-23,24 L-19,25 L-23,26 L-25,30 L-27,26 L-31,25 L-27,24 Z" fill="#FBBF24" /><path d="M20,40 L21,43 L24,44 L21,45 L20,48 L19,45 L16,44 L19,43 Z" fill="#FBBF24" /></g>` }, // 반짝 별
                { id: 5, draw: (c, s=1) => `<g transform="scale(${s}) translate(${(1-s)*100}, ${(1-s)*80}) translate(135, -45) rotate(-10)"><path d="M0,15 L15,15 L0,30 L15,30" stroke="#3b82f6" stroke-width="9" fill="none" stroke-linecap="round" /><path d="M25,0 L35,0 L25,10 L35,10" stroke="#60a5fa" stroke-width="7" fill="none" stroke-linecap="round" /></g>` },
                { id: 6, isBack: true, draw: (c, s=1) => `
                    <g transform="scale(${s}) translate(${(1-s)*100}, ${(1-s)*80})">
                        <g transform="translate(45, 0) rotate(-35, 0, 0) scale(1.05, 0.7)">
                            <path d="M-30,30 L0,-100 L30,30 Z" fill="#a855f7" stroke="#7e22ce" stroke-width="2" />
                            <path d="M-20,5 H20 M-10,-35 H10 M-5,-70 H5" stroke="white" stroke-width="5" stroke-linecap="round" />
                        </g>
                        <circle cx="20" cy="-25" r="4" fill="#ef4444" /><rect x="170" y="-10" width="5" height="5" fill="#3b82f6" />
                        <circle cx="10" cy="140" r="5" fill="#22c55e" /><rect x="185" y="150" width="6" height="6" fill="#eab308" transform="rotate(45, 189, 154)" />
                        <rect x="95" y="165" width="5" height="5" fill="#818cf8" /><circle cx="50" cy="160" r="3" fill="#f472b6" />
                        <rect x="150" y="40" width="4" height="4" fill="#ef4444" /><circle cx="160" cy="130" r="3" fill="#3b82f6" />
                    </g>` },
                { id: 7, draw: (c, s=1) => `<g transform="scale(${s}) translate(${(1-s)*100}, ${(1-s)*80}) translate(145, 10) scale(0.8)"><path d="M-12,-15 Q0,0 12,-15" fill="none" stroke="#ef4444" stroke-width="7" stroke-linecap="round" /><path d="M-25,-2 Q-10,10 -25,22" fill="none" stroke="#ef4444" stroke-width="7" stroke-linecap="round" /><path d="M-12,35 Q0,20 12,35" fill="none" stroke="#ef4444" stroke-width="7" stroke-linecap="round" /><path d="M25,-2 Q10,10 25,22" fill="none" stroke="#ef4444" stroke-width="7" stroke-linecap="round" /></g>` },
                { id: 8, draw: (c, s=1) => `
                    <g transform="scale(${s}) translate(${(1-s)*100}, ${(1-s)*80}) translate(145, -20) scale(0.7)">
                        <path d="M-10,-15 C-25,0 -25,20 -10,20 C5,20 5,0 -10,-15 Z" fill="#60a5fa" stroke="white" stroke-width="0.5" transform="rotate(-15)"/>
                        <path d="M-10,-15 C-25,0 -25,20 -10,20 C5,20 5,0 -10,-15 Z" fill="#93c5fd" stroke="white" stroke-width="0.5" transform="rotate(5) translate(40, 15)"/>
                        <path d="M-10,-15 C-25,0 -25,20 -10,20 C5,20 5,0 -10,-15 Z" fill="#bfdbfe" stroke="white" stroke-width="0.5" transform="rotate(-30) translate(-10, 45)"/>
                    </g>` }
            ]
        };

        function renderFace() {
            const container = document.getElementById('face-container');
            const nosePart = selectedParts.nose !== -1 ? partsData.nose[selectedParts.nose] : null;
            container.innerHTML = `
                <svg id="face-svg" viewBox="5 -85 190 260" class="w-full h-full drop-shadow-xl overflow-visible">
                    ${nosePart && nosePart.isBack ? nosePart.draw("#8D6E63", 1) : ''}
                    <circle cx="100" cy="80" r="95" fill="#FFDBAC" stroke="#D97706" stroke-width="3" />
                    <g class="transition-all duration-300">
                        ${selectedParts.brows !== -1 ? partsData.brows[selectedParts.brows].draw("#5D4037", 1) : ''}
                        ${selectedParts.eyes !== -1 ? partsData.eyes[selectedParts.eyes].draw("#2D1B15", 1) : ''}
                        ${selectedParts.mouth !== -1 ? partsData.mouth[selectedParts.mouth].draw("#2D1B15", 1) : ''}
                        ${nosePart && !nosePart.isBack ? nosePart.draw("#8D6E63", 1) : ''}
                    </g>
                </svg>`;
        }

        function renderGrid() {
            const grid = document.getElementById('items-grid');
            grid.innerHTML = '';
            const list = activeTab === 'nose' ? partsData[activeTab].slice(0, 9) : partsData[activeTab];

            list.forEach((item, index) => {
                const btn = document.createElement('button');
                // item-card 클래스로 크기 160px 고정
                btn.className = `item-card flex items-center justify-center bg-white rounded-xl border-[4px] transition-all hover:shadow-lg ${selectedParts[activeTab] === index ? 'border-yellow-500 bg-yellow-50 scale-105' : 'border-transparent hover:border-yellow-100'}`;
                btn.onclick = () => {
                    selectedParts[activeTab] = (selectedParts[activeTab] === index) ? -1 : index;
                    renderFace();
                    renderGrid();
                };
                
                // 얼굴 크기를 1:1 비례(scale 1)로 유지하고 여백 최소화
                btn.innerHTML = `
                    <svg viewBox="5 -25 190 215" class="w-full h-full p-1 overflow-visible">
                        ${item.isBack ? item.draw("#5D4037", 1) : ''}
                        <circle cx="100" cy="80" r="95" fill="#FFDBAC" stroke="#D97706" stroke-width="3" />
                        ${!item.isBack ? item.draw("#5D4037", 1) : ''}
                    </svg>`;
                grid.appendChild(btn);
            });
        }

        function setActiveTab(tab) {
            activeTab = tab;
            ['brows', 'eyes', 'mouth', 'nose'].forEach(t => {
                const el = document.getElementById('tab-' + t);
                el.className = (t === tab) 
                    ? 'flex-1 py-2.5 rounded-xl font-black transition-all text-lg bg-yellow-400 text-white shadow-md border-b-4 border-yellow-600'
                    : 'flex-1 py-2.5 rounded-xl font-black transition-all text-lg bg-yellow-100 text-yellow-800 hover:bg-yellow-200 border-b-4 border-transparent';
            });
            renderGrid();
        }

        function resetFace() {
            selectedParts = { brows: -1, eyes: -1, mouth: -1, nose: -1 };
            renderFace();
            renderGrid();
        }

        function saveFaceImage() {
            const target = document.getElementById('capture-target');
            html2canvas(target, { backgroundColor: null, scale: 2 }).then(canvas => {
                const link = document.createElement('a');
                link.download = '나만의_표정.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }

        setActiveTab('brows');
        renderFace();
    </script>
</body>
</html>
